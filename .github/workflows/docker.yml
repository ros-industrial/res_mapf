name: Docker

# Build the MAPF AMQP planner image on PRs and main.
# Push to GHCR on main (:main rolling), tags v*.*.* (:latest + bare :X.Y.Z), and
# workflow_dispatch. Versioned release images are tag-only. PRs are build-only.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Build amqp-planner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags use bare semver (0.0.2), not git-style v0.0.2.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/amqp-planner
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/docker/mapf-planner.Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amqp-planner
          cache-to: type=gha,mode=max,scope=amqp-planner
